# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - PlantwiseOnSQLserver

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore Touching_Grass.slnx

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Build with dotnet
        run: dotnet build Touching_Grass.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Touching_Grass.slnx --configuration Release --no-build --no-restore

      - name: Validate Azure SQL migrations
        shell: pwsh
        env:
          AZURESQL_VALIDATION_CONNECTION_STRING: ${{ secrets.AZURESQL_VALIDATION_CONNECTION_STRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURESQL_VALIDATION_CONNECTION_STRING)) {
            Write-Host 'No disposable Azure SQL validation database configured; external migration validation skipped.'
          } else {
            Write-Host 'Applying migrations only to the configured disposable validation database.'
            $env:DOTNET_ENVIRONMENT = 'Production'
            $env:ASPNETCORE_ENVIRONMENT = 'Production'
            $env:ConnectionStrings__DefaultConnection = $env:AZURESQL_VALIDATION_CONNECTION_STRING
            dotnet ef database update --configuration Release --no-build --project Touching_Grass/Touching_Grass.csproj --startup-project Touching_Grass/Touching_Grass.csproj
            dotnet ef database update --configuration Release --no-build --project Touching_Grass/Touching_Grass.csproj --startup-project Touching_Grass/Touching_Grass.csproj
          }

      - name: dotnet publish
        run: dotnet publish Touching_Grass/Touching_Grass.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CF6AC080BD5346EAAC5B941AF4B84D05 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4D04E75E5B6D429E96ACA6157AEA6BAD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6443495849BC4A9B87A33DA3B557ED4C }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'PlantwiseOnSQLserver'
          slot-name: 'Production'
          package: .

      - name: Check out smoke-test source
        uses: actions/checkout@v4
        with:
          path: smoke-source

      - name: Required post-deployment smoke test
        shell: pwsh
        env:
          SMOKE_TEST_URL: ${{ secrets.SMOKE_TEST_URL }}
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}
          SMOKE_TEST_ZIP: ${{ secrets.SMOKE_TEST_ZIP }}
        run: ./smoke-source/scripts/smoke-test.ps1
          